<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFRI Entraide — Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           VARIABLES CSS — Les couleurs et polices
           utilisées partout dans la page
        ============================================ */
        :root {
            --vert-principal: #075E54;   /* Vert foncé style WhatsApp */
            --vert-clair: #25D366;       /* Vert vif pour les boutons */
            --vert-doux: #DCF8C6;        /* Vert très clair pour les fonds */
            --blanc: #FFFFFF;
            --gris-clair: #F0F2F5;
            --gris-texte: #667085;
            --noir-doux: #1A1A2E;
            --police-titre: 'Sora', sans-serif;
            --police-corps: 'DM Sans', sans-serif;
        }

        /* ============================================
           RESET — Supprime les marges par défaut
           du navigateur
        ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================
           BODY — Le fond de toute la page
        ============================================ */
        body {
            font-family: var(--police-corps);
            background-color: var(--gris-clair);
            min-height: 100vh;           /* Prend toute la hauteur de l'écran */
            display: flex;               /* Flexbox pour centrer le contenu */
            align-items: center;
            justify-content: center;
            overflow: hidden;            /* Cache ce qui dépasse */
        }

        /* ============================================
           FOND DÉCORATIF — Les cercles verts en
           arrière-plan pour un effet visuel
        ============================================ */
        .fond-decoration {
            position: fixed;             /* Reste en place même si on scroll */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;                  /* Derrière tout le reste */
            overflow: hidden;
        }

        /* Grand cercle en haut à gauche */
        .fond-decoration .cercle1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37,211,102,0.15), transparent 70%);
            top: -150px;
            left: -150px;
            border-radius: 50%;
            animation: pulser 6s ease-in-out infinite; /* Animation de pulsation */
        }

        /* Petit cercle en bas à droite */
        .fond-decoration .cercle2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(7,94,84,0.12), transparent 70%);
            bottom: -100px;
            right: -100px;
            border-radius: 50%;
            animation: pulser 8s ease-in-out infinite reverse;
        }

        /* Animation de pulsation douce */
        @keyframes pulser {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* ============================================
           CONTENEUR PRINCIPAL — La carte blanche
           au centre de la page
        ============================================ */
        .conteneur {
            position: relative;
            z-index: 1;                  /* Au-dessus du fond décoratif */
            width: 100%;
            max-width: 460px;            /* Largeur maximale */
            margin: 20px;
            background: var(--blanc);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(7,94,84,0.12); /* Ombre verte douce */
            overflow: hidden;
            animation: apparaitre 0.6s ease-out; /* Animation d'apparition */
        }

        /* Animation d'apparition de la carte */
        @keyframes apparaitre {
            from {
                opacity: 0;
                transform: translateY(30px); /* Vient du bas */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           EN-TÊTE — La bande verte en haut de la carte
        ============================================ */
        .entete {
            background: linear-gradient(135deg, var(--vert-principal), #0a8f7a);
            padding: 40px 40px 30px;
            text-align: center;
            position: relative;
        }

        /* Petit motif décoratif dans l'en-tête */
        .entete::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 30px;
            background: var(--blanc);
            border-radius: 30px 30px 0 0; /* Arrondi en bas pour un effet vague */
        }

        /* Le logo / icône en haut */
        .logo-icone {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.15); /* Blanc transparent */
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;             /* Taille de l'emoji */
            backdrop-filter: blur(10px); /* Effet de flou derrière */
        }

        /* Titre principal dans l'en-tête */
        .entete h1 {
            font-family: var(--police-titre);
            font-size: 24px;
            font-weight: 700;
            color: var(--blanc);
            margin-bottom: 6px;
        }

        /* Sous-titre dans l'en-tête */
        .entete p {
            color: rgba(255,255,255,0.75);
            font-size: 14px;
            font-weight: 300;
        }

        /* ============================================
           ONGLETS — Pour basculer entre Connexion
           et Inscription
        ============================================ */
        .onglets {
            display: flex;
            margin: 20px 40px 0;
            background: var(--gris-clair);
            border-radius: 12px;
            padding: 4px;
        }

        /* Chaque onglet individuellement */
        .onglet {
            flex: 1;                     /* Prend la moitié de l'espace */
            padding: 10px;
            text-align: center;
            cursor: pointer;             /* Curseur main au survol */
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--gris-texte);
            transition: all 0.3s ease;  /* Transition douce */
            border: none;
            background: transparent;
            font-family: var(--police-corps);
        }

        /* Onglet actif (sélectionné) */
        .onglet.actif {
            background: var(--blanc);
            color: var(--vert-principal);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* ============================================
           CORPS DU FORMULAIRE
        ============================================ */
        .corps {
            padding: 24px 40px 40px;
        }

        /* Section du formulaire (connexion ou inscription) */
        .section-formulaire {
            display: none;               /* Cachée par défaut */
        }

        /* Section active (visible) */
        .section-formulaire.active {
            display: block;
            animation: glisser 0.3s ease-out; /* Animation d'apparition */
        }

        @keyframes glisser {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ============================================
           GROUPES DE CHAMPS — Chaque champ du formulaire
        ============================================ */
        .groupe-champ {
            margin-bottom: 18px;
        }

        /* Étiquette au-dessus du champ */
        .groupe-champ label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--noir-doux);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        /* Conteneur du champ avec icône */
        .champ-avec-icone {
            position: relative;
        }

        /* L'icône à gauche dans le champ */
        .champ-avec-icone .icone {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%); /* Centré verticalement */
            font-size: 16px;
            z-index: 1;
        }

        /* Les champs input (email, mot de passe...) */
        .champ-avec-icone input {
            width: 100%;
            padding: 13px 14px 13px 44px; /* Espace à gauche pour l'icône */
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            font-size: 14px;
            font-family: var(--police-corps);
            color: var(--noir-doux);
            background: var(--gris-clair);
            transition: all 0.3s ease;   /* Transition douce au focus */
            outline: none;               /* Supprime le contour par défaut */
        }

        /* Quand le champ est sélectionné (focus) */
        .champ-avec-icone input:focus {
            border-color: var(--vert-clair);
            background: var(--blanc);
            box-shadow: 0 0 0 4px rgba(37,211,102,0.1); /* Halo vert */
        }

        /* ============================================
           LIGNE DOUBLE — Pour mettre deux champs
           côte à côte (nom et prénom)
        ============================================ */
        .ligne-double {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Deux colonnes égales */
            gap: 12px;
        }

        /* ============================================
           BOUTON PRINCIPAL — Se connecter / S'inscrire
        ============================================ */
        .bouton-principal {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--vert-clair), #1db954);
            color: var(--blanc);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: var(--police-corps);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        /* Effet au survol du bouton */
        .bouton-principal:hover {
            transform: translateY(-2px);  /* Monte légèrement */
            box-shadow: 0 8px 25px rgba(37,211,102,0.4); /* Ombre verte */
        }

        /* Effet au clic du bouton */
        .bouton-principal:active {
            transform: translateY(0);    /* Revient en place */
        }

        /* ============================================
           SÉPARATEUR — La ligne "OU" entre le bouton
           et les options alternatives
        ============================================ */
        .separateur {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--gris-texte);
            font-size: 13px;
        }

        /* Les lignes de chaque côté du "OU" */
        .separateur::before,
        .separateur::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E8ECF0;
        }

        /* ============================================
           MESSAGE D'ERREUR — Affiché si mauvais
           email ou mot de passe
        ============================================ */
        .message-erreur {
            background: #FFF0F0;
            border: 1px solid #FFB3B3;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #D32F2F;
            margin-bottom: 16px;
            display: none;               /* Caché par défaut */
        }

        /* ============================================
           LIEN MOT DE PASSE OUBLIÉ
        ============================================ */
        .lien-oubli {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 16px;
        }

        .lien-oubli a {
            font-size: 12px;
            color: var(--vert-principal);
            text-decoration: none;
            font-weight: 500;
        }

        .lien-oubli a:hover {
            text-decoration: underline;
        }

        /* ============================================
           PIED DE PAGE DE LA CARTE
        ============================================ */
        .pied-carte {
            text-align: center;
            padding: 0 40px 30px;
            font-size: 12px;
            color: var(--gris-texte);
        }

        /* ============================================
           SÉLECTEUR — Pour la filière et le niveau
        ============================================ */
        .champ-avec-icone select {
            width: 100%;
            padding: 13px 14px 13px 44px;
            border: 2px solid #E8ECF0;
            border-radius: 12px;
            font-size: 14px;
            font-family: var(--police-corps);
            color: var(--noir-doux);
            background: var(--gris-clair);
            transition: all 0.3s ease;
            outline: none;
            appearance: none;            /* Supprime la flèche par défaut */
            cursor: pointer;
        }

        .champ-avec-icone select:focus {
            border-color: var(--vert-clair);
            background: var(--blanc);
            box-shadow: 0 0 0 4px rgba(37,211,102,0.1);
        }

        /* ============================================
           RESPONSIVE — Adaptation sur petit écran
        ============================================ */
        @media (max-width: 480px) {
            .conteneur {
                margin: 10px;
                border-radius: 20px;
            }
            .entete, .corps, .onglets {
                padding-left: 24px;
                padding-right: 24px;
            }
            .onglets {
                margin-left: 24px;
                margin-right: 24px;
            }
            .ligne-double {
                grid-template-columns: 1fr; /* Une seule colonne sur mobile */
            }
        }
    </style>
</head>
<body>

    <!-- Fond décoratif avec les cercles verts -->
    <div class="fond-decoration">
        <div class="cercle1"></div>
        <div class="cercle2"></div>
    </div>

    <!-- Carte principale -->
    <div class="conteneur">

        <!-- En-tête verte -->
        <div class="entete">
            <div class="logo-icone">🎓</div>
            <h1>IFRI Entraide</h1>
            <p>Plateforme d'entraide entre étudiants</p>
        </div>

        <!-- Onglets Connexion / Inscription -->
        <div class="onglets">
            <!-- onclick="basculer('connexion')" → appelle la fonction JS quand on clique -->
            <button class="onglet actif" onclick="basculer('connexion')">Connexion</button>
            <button class="onglet" onclick="basculer('inscription')">Inscription</button>
        </div>

        <!-- Corps du formulaire -->
        <div class="corps">

            <!-- ===== FORMULAIRE DE CONNEXION ===== -->
            <div id="connexion" class="section-formulaire active">

                <!-- Message d'erreur (caché par défaut) -->
                <div class="message-erreur" id="erreur-connexion">
                    ⚠️ Email ou mot de passe incorrect. Réessaie.
                </div>

                <!-- Champ Email -->
                <div class="groupe-champ">
                    <label>Adresse email</label>
                    <div class="champ-avec-icone">
                        <span class="icone">✉️</span>
                        <input type="email" id="email-connexion" placeholder="ton.email@ifri.bj">
                    </div>
                </div>

                <!-- Champ Mot de passe -->
                <div class="groupe-champ">
                    <label>Mot de passe</label>
                    <div class="champ-avec-icone">
                        <span class="icone">🔒</span>
                        <input type="password" id="mdp-connexion" placeholder="••••••••">
                    </div>
                </div>

                <!-- Lien mot de passe oublié -->
                <div class="lien-oubli">
                    <a href="#">Mot de passe oublié ?</a>
                </div>

                <!-- Bouton de connexion -->
                <!-- onclick="connecter()" → appelle la fonction JS -->
                <button class="bouton-principal" onclick="connecter()">
                    Se connecter
                </button>

            </div>

            <!-- ===== FORMULAIRE D'INSCRIPTION ===== -->
            <div id="inscription" class="section-formulaire">

                <!-- Nom et Prénom côte à côte -->
                <div class="ligne-double">
                    <div class="groupe-champ">
                        <label>Nom</label>
                        <div class="champ-avec-icone">
                            <span class="icone">👤</span>
                            <input type="text" id="nom" placeholder="Ton nom">
                        </div>
                    </div>
                    <div class="groupe-champ">
                        <label>Prénom</label>
                        <div class="champ-avec-icone">
                            <span class="icone">👤</span>
                            <input type="text" id="prenom" placeholder="Ton prénom">
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="groupe-champ">
                    <label>Adresse email</label>
                    <div class="champ-avec-icone">
                        <span class="icone">✉️</span>
                        <input type="email" id="email-inscription" placeholder="ton.email@ifri.bj">
                    </div>
                </div>

                <!-- Filière -->
                <div class="groupe-champ">
                    <label>Filière</label>
                    <div class="champ-avec-icone">
                        <span class="icone">📚</span>
                        <!-- select = liste déroulante -->
                        <select id="filiere">
                            <option value="">Choisir une filière</option>
                            <option value="GL">Génie Logiciel</option>
                            <option value="RT">Internet et multimédiat</option>
                            <option value="SI">Sécurité informatique</option>
                            <option value="IA">Intelligence Artificielle</option>
                            <option value="SEIOT">Systeme embarqué et internet des objets</option>
                        </select>
                    </div>
                </div>

                <!-- Niveau et Mot de passe côte à côte -->
                <div class="ligne-double">
                    <div class="groupe-champ">
                        <label>Niveau</label>
                        <div class="champ-avec-icone">
                            <span class="icone">🎯</span>
                            <select id="niveau">
                                <option value="">Niveau</option>
                                <option value="L1">Licence 1</option>
                                <option value="L2">Licence 2</option>
                                <option value="L3">Licence 3</option>
                                <option value="M1">Master 1</option>
                                <option value="M2">Master 2</option>
                            </select>
                        </div>
                    </div>
                    <div class="groupe-champ">
                        <label>Mot de passe</label>
                        <div class="champ-avec-icone">
                            <span class="icone">🔒</span>
                            <input type="password" id="mdp-inscription" placeholder="••••••">
                        </div>
                    </div>
                </div>

                <!-- Bouton d'inscription -->
                <button class="bouton-principal" onclick="inscrire()">
                    Créer mon compte
                </button>

            </div>

        </div>

        <!-- Pied de la carte -->
        <div class="pied-carte">
            🔐 Réservé aux étudiants de l'IFRI
        </div>

    </div>

    <script>
        /*
         * JAVASCRIPT — La logique interactive de la page
         * Ce code s'exécute dans le navigateur
         */

        /*
         * basculer(onglet) — Affiche le bon formulaire
         * quand on clique sur un onglet
         * @param onglet : 'connexion' ou 'inscription'
         */
        function basculer(onglet) {
            // Récupère tous les onglets et sections
            const onglets = document.querySelectorAll('.onglet');
            const sections = document.querySelectorAll('.section-formulaire');

            // Retire la classe 'actif' et 'active' de tout
            onglets.forEach(o => o.classList.remove('actif'));
            sections.forEach(s => s.classList.remove('active'));

            // Active l'onglet cliqué
            // event.target = le bouton sur lequel on a cliqué
            event.target.classList.add('actif');

            // Affiche la bonne section
            document.getElementById(onglet).classList.add('active');
        }

        /*
         * connecter() — Vérifie les champs de connexion
         * Pour l'instant affiche juste une alerte
         * Plus tard sera lié au backend Python
         */
        function connecter() {
            const email = document.getElementById('email-connexion').value;
            const mdp = document.getElementById('mdp-connexion').value;

            // Vérifie que les champs ne sont pas vides
            if (!email || !mdp) {
                document.getElementById('erreur-connexion').style.display = 'block';
                return; // Arrête la fonction
            }

            // Cache le message d'erreur si tout est ok
            document.getElementById('erreur-connexion').style.display = 'none';

            // TODO: Envoyer les données au backend Python Flask
            // Pour l'instant on simule une connexion réussie
            alert('Connexion en cours... (à relier au backend)');
        }

        /*
         * inscrire() — Vérifie les champs d'inscription
         * Pour l'instant affiche juste une alerte
         */
        function inscrire() {
            const nom = document.getElementById('nom').value;
            const prenom = document.getElementById('prenom').value;
            const email = document.getElementById('email-inscription').value;
            const filiere = document.getElementById('filiere').value;
            const niveau = document.getElementById('niveau').value;
            const mdp = document.getElementById('mdp-inscription').value;

            // Vérifie que tous les champs sont remplis
            if (!nom || !prenom || !email || !filiere || !niveau || !mdp) {
                alert('Veuillez remplir tous les champs !');
                return;
            }

            // TODO: Envoyer les données au backend Python Flask
            alert('Inscription en cours... (à relier au backend)');
        }
    </script>

</body>
</html>
