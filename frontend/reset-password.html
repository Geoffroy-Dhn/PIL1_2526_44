<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation - IFRI_MentorLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { transform: translateY(-2px); }
        .error { background: #fee; color: #c00; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .success { background: #efe; color: #0a0; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Nouveau mot de passe</h1>
        
        <div id="errorMsg" class="error hidden"></div>
        <div id="successMsg" class="success hidden"></div>
        
        <form id="resetForm">
            <div class="form-group">
                <label>🔒 Nouveau mot de passe</label>
                <input type="password" id="newPassword" required minlength="6">
            </div>
            <div class="form-group">
                <label>🔒 Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <button type="submit">Réinitialiser le mot de passe</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('errorMsg').textContent = 'Lien invalide. Veuillez demander un nouveau lien.';
            document.getElementById('errorMsg').classList.remove('hidden');
            document.getElementById('resetForm').style.display = 'none';
        } else {
            // Vérifier que le token est valide
            fetch(`/api/auth/verify-reset-token?token=${token}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.valid) {
                        document.getElementById('errorMsg').textContent = data.error || 'Lien invalide ou expiré';
                        document.getElementById('errorMsg').classList.remove('hidden');
                        document.getElementById('resetForm').style.display = 'none';
                    }
                })
                .catch(() => {
                    document.getElementById('errorMsg').textContent = 'Erreur de vérification';
                    document.getElementById('errorMsg').classList.remove('hidden');
                });
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                document.getElementById('errorMsg').textContent = 'Les mots de passe ne correspondent pas';
                document.getElementById('errorMsg').classList.remove('hidden');
                return;
            }
            
            if (newPassword.length < 6) {
                document.getElementById('errorMsg').textContent = 'Le mot de passe doit contenir au moins 6 caractères';
                document.getElementById('errorMsg').classList.remove('hidden');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword })
                });
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('successMsg').textContent = '✅ Mot de passe modifié avec succès ! Redirection vers la connexion...';
                    document.getElementById('successMsg').classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 3000);
                } else {
                    document.getElementById('errorMsg').textContent = data.error;
                    document.getElementById('errorMsg').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('errorMsg').textContent = 'Erreur de connexion';
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
