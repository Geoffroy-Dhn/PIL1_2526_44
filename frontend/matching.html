<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching - IFRI_MentorLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links a {
            color: #555;
            text-decoration: none;
            margin-left: 25px;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card h2 { margin-bottom: 20px; color: #333; }
        .match-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #28a745;
            transition: all 0.3s;
        }
        .match-card:hover { transform: translateX(8px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .match-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .match-photo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .match-photo img { width: 100%; height: 100%; object-fit: cover; }
        .match-info { flex: 1; }
        .match-name { font-size: 20px; font-weight: bold; color: #333; }
        .match-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
            background: #28a745;
            color: white;
        }
        .match-score {
            background: #28a745;
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            min-width: 100px;
        }
        .match-details { margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0; }
        .detail-row { display: flex; flex-wrap: wrap; margin-bottom: 12px; align-items: flex-start; }
        .detail-label { width: 140px; font-weight: 600; color: #555; }
        .detail-value { flex: 1; color: #333; }
        .competence-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .competence-tag {
            background: #e9ecef;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #495057;
        }
        .competence-common { background: #d4edda; color: #155724; }
        .btn-contact {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-contact:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .no-matches { text-align: center; color: #999; padding: 40px; }
        .loading { text-align: center; padding: 40px; color: #667eea; }
        @media (max-width: 768px) {
            .match-header { flex-direction: column; text-align: center; }
            .detail-label { width: 100%; margin-bottom: 5px; }
            .detail-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🏫 IFRI_MentorLink</div>
        <div class="nav-links">
            <a href="./dashboard.html">Tableau de bord</a>
            <a href="./offres_demandes.html">Offres/Demandes</a>
            <a href="./matching.html" class="active">Matching</a>
            <a href="./profil.html">Mon profil</a>
            <a href="./messages.html">Messages</a>
            <a href="#" onclick="confirmLogout()">Déconnexion</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>🔍 Suggestions de mentorat</h2>
            <div id="matchesContainer" class="loading">Chargement des matches...</div>
            <button id="generateBtn" class="btn-primary" onclick="generateMatches()">🔄 Générer de nouveaux matches</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentUserId = null;
        const API_BASE = '';  // Utilise le même domaine que la page
        
        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '/login.html'; return false; }
            try {
                const response = await fetch('http://localhost:5000/api/auth/verify', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.valid) {
                    currentUser = data.user;
                    currentUserId = data.user_id;
                    return true;
                }
                localStorage.removeItem('token');
                window.location.href = '/login.html';
                return false;
            } catch (error) { return false; }
        }
        
        async function loadMatches() {
            const token = localStorage.getItem('token');
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading">⏳ Chargement des matches...</div>';
            
            try {
                const response = await fetch('http://localhost:5000/api/matching/my-matches', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('Erreur serveur');
                
                let matches = await response.json();
                
                if (!matches || matches.length === 0) {
                    container.innerHTML = '<div class="no-matches">🤝 Aucun match pour le moment<br><small>Complétez votre profil et générez des matches</small></div>';
                    return;
                }
                
                let html = '';
                for (const match of matches) {
                    const competencesRes = await fetch(`http://localhost:5000/api/matching/common-competences/${match.id_autre}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const disposRes = await fetch(`http://localhost:5000/api/matching/common-disponibilites/${match.id_autre}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const competences = await competencesRes.json();
                    const dispos = await disposRes.json();
                    
                    const photoHtml = match.photo_profil ? 
                        `<img src="${match.photo_profil}" onerror="this.src=''">` : 
                        `<span>${match.prenom?.[0] || '?'}</span>`;
                    
                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <div class="match-photo">${photoHtml}</div>
                                <div class="match-info">
                                    <div>
                                        <span class="match-name">${match.prenom} ${match.nom}</span>
                                        <span class="match-badge">🤝 Suggestion</span>
                                    </div>
                                    <div style="color:#666; margin-top:5px;">⭐ Score de compatibilité : <strong>${Math.round(match.score_global)}%</strong></div>
                                </div>
                                <div class="match-score">${Math.round(match.score_global)}%</div>
                            </div>
                            
                            <div class="match-details">
                                <div class="detail-row">
                                    <div class="detail-label">📚 Matières en commun :</div>
                                    <div class="detail-value">
                                        <div class="competence-list">
                                            ${competences.length > 0 ? 
                                                competences.map(c => `<span class="competence-tag competence-common">${c.nom}</span>`).join('') : 
                                                '<span>Aucune compétence en commun</span>'}
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="detail-row">
                                    <div class="detail-label">⏰ Disponibilités communes :</div>
                                    <div class="detail-value">
                                        <div class="competence-list">
                                            ${dispos.length > 0 ? 
                                                dispos.map(d => `<span class="competence-tag">📅 ${d.jour_semaine} ${d.heure_debut} - ${d.heure_fin}</span>`).join('') : 
                                                '<span>Aucune disponibilité commune</span>'}
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="detail-row">
                                    <div class="detail-label">🎯 Détails du score :</div>
                                    <div class="detail-value">
                                        <div class="competence-list">
                                            <span class="competence-tag">⭐ Compétences: ${Math.round(match.score_competences || 0)}%</span>
                                            <span class="competence-tag">🏫 Filière: ${Math.round(match.score_filiere || 0)}%</span>
                                            <span class="competence-tag">⏰ Disponibilités: ${Math.round(match.score_disponibilite || 0)}%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <button class="btn-contact" onclick="contactUser(${match.id_autre})">💬 Contacter ${match.prenom}</button>
                        </div>
                    `;
                }
                
                container.innerHTML = html;
            } catch (error) {
                console.error('Erreur:', error);
                container.innerHTML = '<div class="no-matches">❌ Erreur de chargement</div>';
            }
        }
        
        async function generateMatches() {
            const token = localStorage.getItem('token');
            const btn = document.getElementById('generateBtn');
            btn.textContent = '🔄 Génération...';
            btn.disabled = true;
            
            try {
                const response = await fetch('http://localhost:5000/api/matching/generate', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                if (response.ok) {
                    alert(`${result.message}\n${result.matches_generes} nouveau(x) match(s) trouvé(s) !`);
                    loadMatches();
                } else {
                    alert(result.error);
                }
            } catch (error) {
                alert('Erreur lors de la génération');
            } finally {
                btn.textContent = '🔄 Générer de nouveaux matches';
                btn.disabled = false;
            }
        }
        
        async function contactUser(userId) {
            const token = localStorage.getItem('token');
            try {
                const response = await fetch(`http://localhost:5000/api/conversations/${userId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (response.ok) {
                    window.location.href = `./messages.html?conv=${data.conversation_id}`;
                } else {
                    alert('Erreur: ' + data.error);
                }
            } catch (error) {
                alert('Erreur lors de la création de la conversation');
            }
        }
        
        function confirmLogout() {
            if (confirm('Êtes-vous sûr(e) de vouloir vous déconnecter ?')) {
                localStorage.removeItem('token');
                window.location.href = './login.html';
            }
        }
        
        checkAuth().then(isAuth => { if (isAuth) loadMatches(); });
    </script>
</body>
</html>
